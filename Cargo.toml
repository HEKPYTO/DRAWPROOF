[workspace]
members = ["crates/drawproof-lib", "crates/drawproof", "crates/drawproof-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
clap = { version = "4.5", features = ["derive"] }
drand = { version = "0.6.0", default-features = false, features = ["bls12-381", "std"] }
ed25519-dalek = "3.0.0"
getrandom = "0.3"
hex = "0.4"
predicates = "3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
thiserror = "2.0"
tiny_http = "0.12"
ureq = "2.12"

[profile.release]
strip = true
codegen-units = 1
