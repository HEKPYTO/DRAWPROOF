[package]
name = "drawproof"
description = "Commit a dataset, draw a sample from public randomness, and verify the receipt offline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["randomness", "drand", "sampling", "verification", "receipt"]
categories = ["command-line-utilities", "cryptography"]
publish = false

[[bin]]
name = "drawproof"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
drawproof-lib = { path = "../drawproof-lib", version = "0.1.0" }
hex.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tiny_http.workspace = true
